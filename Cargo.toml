[package]
name = "blinky"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.86"
base64 = "0.22.1"
futures-util = "0.3.31"
http = "1.2.0"
poise = "0.6.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
serenity = { default-features = false, optional = true, version = "0.12.4", features = [
    "voice",
    "gateway",
] }
tokio = { version = "1.43.0", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "fs",
] }
tokio-websockets = { version = "0.11.2", features = [
    "client",
    "getrandom",
    "native-tls",
    "openssl",
] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[dependencies.songbird]
version = "0.4.6"
default-features = false
features = [
    "builtin-queue",
    "native",
    "driver",
    "gateway",
    "serenity",
    "receive",
]
