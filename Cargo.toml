[package]
name = "blinky"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.87"
base64 = "0.22.1"
dotenvy = { git = "https://github.com/allan2/dotenvy", version = "0.15.7", features = ["macros"] }
futures-util = { version = "0.3.31", features = ["sink"] }
http = "1.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "fs",
] }
tokio-websockets = { version = "0.11.3", features = [
    "client",
    "getrandom",
    "native-tls",
    "openssl",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
twilight-cache-inmemory = "0.16.0"
twilight-gateway = { version = "0.16.0", default-features = false, features = [
    "native-tls",
    "twilight-http",
] }
twilight-http = { version = "0.16.0", default-features = false, features = [
    "decompression",
    "native-tls",
] }
twilight-interactions = "0.16.1"
twilight-model = "0.16.0"
twilight-standby = "0.16.0"
twilight-util = { version = "0.16.0", features = ["builder"] }
